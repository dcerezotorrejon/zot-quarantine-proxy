# Configuración mínima de clamd (daemon de ClamAV) para proxy y updater.
#
# Corre en primer plano (Foreground yes) y lo arranca el entrypoint en segundo
# plano; sin `User`, corre como root (el mismo usuario del contenedor) para poder
# leer los rootfs temporales que descomprime el escáner.
PidFile /run/clamav/clamd.pid
DatabaseDirectory /var/lib/clamav
LocalSocket /run/clamav/clamd.sock
Foreground yes
SelfCheck 600
